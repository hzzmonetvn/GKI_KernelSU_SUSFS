name: Build Kernel

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release Type"
        type: choice
        options:
          - Actions
          - Pre-Release
          - Release
        default: Actions

      kernelsu_variant:
        description: "KernelSU Variant"
        type: choice
        options:
          - SukiSU
          - ReSukiSU
          - Official
          - MKSU
        default: ReSukiSU
      kernelsu_branch:
        description: "KSU Branch (Stable or Dev)"
        type: choice
        options:
          - "Stable(标准)"
          - "Dev(开发)"
        default: "Stable(标准)"

      version:
        description: "Custom Version Name (Optional)"
        type: string
        default: ""
        required: false
      build_time:
        description: "Custom Build Time (Optional, N or empty = Current UTC)"
        type: string
        default: ""
        required: false

      use_zram:
        description: "Enable ZRAM Enhancement"
        type: boolean
        default: false
      use_bbg:
        description: "Enable BBG Protection"
        type: boolean
        default: false
      use_kpm:
        description: "Enable KPM Support"
        type: boolean
        default: false
      use_rekernel:
        description: "Enable Re-Kernel Driver"
        type: boolean
        default: false
      cancel_susfs:
        description: "Disable SUSFS"
        type: boolean
        default: false

      build_a12_5_10:
        description: "Android 12 - 5.10"
        type: boolean
        default: false
      build_a13_5_15:
        description: "Android 13 - 5.15"
        type: boolean
        default: false
      build_a14_6_1:
        description: "Android 14 - 6.1"
        type: boolean
        default: false
      build_a15_6_6:
        description: "Android 15 - 6.6"
        type: boolean
        default: false
      build_a16_6_12:
        description: "Android 16 - 6.12"
        type: boolean
        default: false
      build_all:
        description: "Build All Versions"
        type: boolean
        default: true

jobs:
  get-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}

  build-a12-5-10:
    if: inputs.build_a12_5_10 || inputs.build_all
    uses: ./.github/workflows/kernel-a12-5-10.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cancel_susfs: ${{ inputs.cancel_susfs }}
      called_from_main: true

  build-a13-5-15:
    if: inputs.build_a13_5_15 || inputs.build_all
    uses: ./.github/workflows/kernel-a13-5-15.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cancel_susfs: ${{ inputs.cancel_susfs }}
      called_from_main: true

  build-a14-6-1:
    if: inputs.build_a14_6_1 || inputs.build_all
    uses: ./.github/workflows/kernel-a14-6-1.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cancel_susfs: ${{ inputs.cancel_susfs }}
      called_from_main: true

  build-a15-6-6:
    if: inputs.build_a15_6_6 || inputs.build_all
    uses: ./.github/workflows/kernel-a15-6-6.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cancel_susfs: ${{ inputs.cancel_susfs }}
      called_from_main: true

  build-a16-6-12:
    if: inputs.build_a16_6_12 || inputs.build_all
    uses: ./.github/workflows/kernel-a16-6-12.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cancel_susfs: ${{ inputs.cancel_susfs }}
      called_from_main: true

  collect-rejects:
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    needs: [build-a12-5-10, build-a13-5-15, build-a14-6-1, build-a15-6-6, build-a16-6-12]
    steps:
      - name: Download Rejects
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts
          pattern: '*-Rejects'

      - name: Process Reject Files
        run: |
          mkdir -p aio-rejects
          if [ -d "./downloaded-artifacts" ]; then
            for dir in ./downloaded-artifacts/*-Rejects; do
              [ -d "$dir" ] || continue
              dirname=$(basename "$dir")
              original_name=${dirname%-Rejects}
              mkdir -p "aio-rejects/$original_name"
              cp -r "$dir/." "aio-rejects/$original_name/"
            done
          fi
          if [ "$(ls -A aio-rejects 2>/dev/null)" ]; then
            cd aio-rejects && zip -r -q -9 ../AIO-REJ.zip . && cd ..
          fi

      - name: Upload Combined Rejects
        uses: actions/upload-artifact@v6
        with:
          name: AIO-REJ
          path: AIO-REJ.zip
          if-no-files-found: ignore

  release:
    if: always() && !cancelled() && inputs.release_type != 'Actions' && github.repository == 'hzzmonetvn/GKI_KernelSU_SUSFS'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [get-manager, build-a12-5-10, build-a13-5-15, build-a14-6-1, build-a15-6-6, build-a16-6-12]
    env:
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set Environment Variables
        run: |
          case "${{ inputs.kernelsu_variant }}" in
            "Next")      KSU_NAME="KernelSU-Next" ;;
            "Official")  KSU_NAME="KernelSU" ;;
            "MKSU")      KSU_NAME="MKSU" ;;
            "SukiSU")    KSU_NAME="SukiSU" ;;
            "ReSukiSU")  KSU_NAME="ReSukiSU" ;;
          esac
          echo "KSU_NAME=$KSU_NAME" >> $GITHUB_ENV
          echo "KSU_VER=${{ needs.get-manager.outputs.ksuVer || 'Unknown' }}" >> $GITHUB_ENV
          echo "SUS_VER=${{ needs.get-manager.outputs.susVer || 'Unknown' }}" >> $GITHUB_ENV
          echo "LZ4_STATUS=${{ inputs.use_zram && 'Enabled' || 'Disabled' }}" >> $GITHUB_ENV
          echo "BBG_STATUS=${{ inputs.use_bbg && 'Supported' || 'Not Supported' }}" >> $GITHUB_ENV
          echo "KPM_LINE=${{ inputs.use_kpm && '-> KPM Support' || '' }}" >> $GITHUB_ENV
          echo "LZ4_SUFFIX=${{ inputs.use_zram && ', LZ4KD' || '' }}" >> $GITHUB_ENV
          
          [[ "${{ inputs.kernelsu_variant }}" == "SukiSU" || "${{ inputs.kernelsu_variant }}" == "ReSukiSU" ]] && echo "HOOK_TYPE=-> SUSFS Inline Hooks" >> $GITHUB_ENV || echo "HOOK_TYPE=-> KPROBE Hooks" >> $GITHUB_ENV
          [[ "${{ inputs.kernelsu_variant }}" == "Official" ]] && (echo "MOUNT_TYPE=-> OVERLAYFS" >> $GITHUB_ENV; echo "KSU_SUFFIX=Stock" >> $GITHUB_ENV) || (echo "MOUNT_TYPE=-> Magic Mount" >> $GITHUB_ENV; echo "KSU_SUFFIX=" >> $GITHUB_ENV)
          [[ "${{ inputs.kernelsu_branch }}" == "Dev(Development)" ]] && echo "BRANCH_INFO=(${{ needs.get-manager.outputs.ksuVer }})" >> $GITHUB_ENV || echo "BRANCH_INFO=Stable" >> $GITHUB_ENV
          
          echo "RELEASE_NAME=GKI: ${KSU_NAME}(${{ needs.get-manager.outputs.ksuVer || 'N/A' }}) & SUSFS ${{ needs.get-manager.outputs.susVer || 'N/A' }}" >> $GITHUB_ENV

      - name: Get KSU Commit Info
        run: |
          case "${{ inputs.kernelsu_variant }}" in
            "Official") REPO_URL="https://github.com/tiann/KernelSU.git"; REPO_URL2="tiann/KernelSU" ;;
            "Next") REPO_URL="https://github.com/KernelSU-Next/KernelSU-Next.git"; REPO_URL2="KernelSU-Next/KernelSU-Next" ;;
            "MKSU") REPO_URL="https://github.com/5ec1cff/KernelSU.git"; REPO_URL2="5ec1cff/KernelSU" ;;
            "SukiSU") REPO_URL="https://github.com/SukiSU-Ultra/SukiSU-Ultra.git"; REPO_URL2="SukiSU-Ultra/SukiSU-Ultra" ;;
            "ReSukiSU") REPO_URL="https://github.com/ReSukiSU/ReSukiSU.git"; REPO_URL2="ReSukiSU/ReSukiSU" ;;
          esac
          BRANCH="main"; [[ "${{ inputs.kernelsu_variant }}" == "Next" ]] && BRANCH="dev"
          if [[ "${{ inputs.kernelsu_branch }}" == "Stable(Standard)" && "${{ inputs.kernelsu_variant }}" != "MKSU" ]]; then
            TAG=$(git ls-remote --tags --sort=-v:refname $REPO_URL | grep -o 'refs/tags/.*' | cut -d'/' -f3 | head -n1)
            echo "KSU_REF=$TAG" >> $GITHUB_ENV
            echo "KSU_URL=https://github.com/$REPO_URL2/releases/tag/$TAG" >> $GITHUB_ENV
          else
            HASH=$(git ls-remote $REPO_URL refs/heads/$BRANCH | awk '{ print $1 }')
            echo "KSU_REF=$HASH" >> $GITHUB_ENV
            echo "KSU_URL=https://github.com/$REPO_URL2/commit/$HASH" >> $GITHUB_ENV
          fi

      - name: Generate Release Notes
        run: |
          cat > release_body.md << EOF
          ## 📦 Release Contents
          **${{ env.KSU_NAME }}** + **SUSFS ${{ env.SUS_VER }}**${{ env.LZ4_SUFFIX }}
          
          ### ✨ Features
          | Component | Status |
          |:---|:---|
          | ${{ env.KSU_NAME }} | ${{ env.KSU_SUFFIX }} ${{ env.BRANCH_INFO }} |
          | SUSFS | ඞ ${{ env.SUS_VER }} |
          | BBG Patch | ${{ env.BBG_STATUS }} |
          | LZ4 Optimization | ${{ env.LZ4_STATUS }} |
          
          ${{ env.HOOK_TYPE }}
          ${{ env.MOUNT_TYPE }}
          ${{ env.KPM_LINE }} 
          
          ---
          > [!IMPORTANT]
          > ### ⚠️ Risk Disclaimer
          > This build contains experimental upstream patches. Bootloops may occur. Always keep a stock boot image backup.
          
          **KernelSU Info**: [${{ env.KSU_REF }}](${{ env.KSU_URL }})
          EOF

      - name: Generate Version Tag
        run: |
          SUS_VERSION="${{ needs.get-manager.outputs.susVer }}"
          [[ -z "$SUS_VERSION" ]] && SUS_VERSION="1.0.0"
          LATEST_TAG=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags --jq '.[0].name' 2>/dev/null | sed 's/-.*//' || echo "")
          [[ "$SUS_VERSION" == "$LATEST_TAG" ]] && LATEST_TAG=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags --jq '.[0].name') || LATEST_TAG="$SUS_VERSION-r0"
          NEW_TAG=$(echo "$LATEST_TAG" | awk -F'-r' '{suffix=$2; if (!suffix) suffix=0; suffix++; printf "%s-r%d", $1, suffix}')
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          git tag "$NEW_TAG"
          git push --tags

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts

      - name: Create GitHub Release
        run: |
          FLAGS=""; [[ "${{ inputs.release_type }}" == "Pre-Release" ]] && FLAGS="--prerelease"
          gh release create "$NEW_TAG" --title "${{ env.RELEASE_NAME }}" --notes-file release_body.md $FLAGS

      - name: Upload Manager and Kernel Assets
        continue-on-error: true
        run: |
          find ./downloaded-artifacts -type f \( -name "*.apk" -o -path "*/susfs-*/*" -o -name "KernelSU_Next_*" -o -name "Image*" -o -name "*.zip" \) -not -path "*/-Rejects/*" | while read -r f; do
            echo "Uploading $f..."
            gh release upload "$NEW_TAG" "$f" || true
          done

      - name: Summary
        run: |
          echo "## Release Created Successfully" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: $NEW_TAG" >> $GITHUB_STEP_SUMMARY
          echo "- **Link**: https://github.com/$REPO_OWNER/$REPO_NAME/releases/tag/$NEW_TAG" >> $GITHUB_STEP_SUMMARY
