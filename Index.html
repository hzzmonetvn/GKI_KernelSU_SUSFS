<!DOCTYPE html>
<html lang="en">
<head>
    <title>Kernel Builder</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>Kernel Builder</h1>
    <form id="dispatchForm">
        <label>Workflow:</label>
        <select id="workflow" name="workflow" required>
            <option value="">Select</option>
            <optgroup label="Build Kernels">
                <option value="build-kernel-a12-5.10.yml">build-kernel-a12-5.10</option>
                <option value="build-kernel-a13-5.10.yml">build-kernel-a13-5.10</option>
                <option value="build-kernel-a13-5.15.yml">build-kernel-a13-5.15</option>
                <option value="build-kernel-a14-5.15.yml">build-kernel-a14-5.15</option>
                <option value="build-kernel-a14-6.yml">build-kernel-a14-6</option>
                <option value="build-kernel-a15-6.yml">build-kernel-a15-6</option>
            </optgroup>
            <option value="test_release.yml">test_release</option>
        </select><br><br>

        <div id="testReleaseInputs" style="display:none;">
            <label><input type="checkbox" name="make_release" value="true" checked> Create release?</label><br>
            <label>KernelSU Variant:</label>
            <select name="kernelsu_variant">
                <option value="Official">Official</option>
                <option value="Next">Next</option>
                <option value="MKSU">MKSU</option>
                <option value="SukiSU" selected>SukiSU</option>
            </select><br>
            <label>KSU Branch:</label>
            <select name="kernelsu_branch">
                <option value="Stable(标准)">Stable</option>
                <option value="Dev(开发)" selected>Dev</option>
                <option value="Other(其他/指定)">Other</option>
            </select><br>
            <input type="text" name="version" placeholder="Custom version suffix"><br>
            <label><input type="checkbox" name="use_zram" value="true" checked> Enable more ZRAM algos?</label><br>
            <label><input type="checkbox" name="use_bbg" value="true" checked> Enable BBG anti-brick patch?</label><br>
            <label><input type="checkbox" name="use_kpm" value="true" checked> Enable KPM?</label><br>
            <label><input type="checkbox" name="get_manager" value="true"> Get latest KSU manager?</label><br>
        </div>

        <div id="buildInputs" style="display:none;">
            <label>KernelSU Variant:</label>
            <select name="kernelsu_variant">
                <option value="Official">Official</option>
                <option value="Next">Next</option>
                <option value="MKSU">MKSU</option>
                <option value="SukiSU" selected>SukiSU</option>
            </select><br>
            <label>KSU Branch:</label>
            <select name="kernelsu_branch">
                <option value="Stable(标准)" selected>Stable</option>
                <option value="Dev(开发)">Dev</option>
                <option value="Other(其他/指定)">Other</option>
            </select><br>
            <input type="text" name="version" placeholder="Custom version suffix"><br>
            <input type="text" name="build_time" placeholder="Build time (format per repo)"><br>
            <label><input type="checkbox" name="use_zram" value="true" checked> Enable more ZRAM algos?</label><br>
            <label><input type="checkbox" name="use_bbg" value="true" checked> Enable BBG anti-brick patch? (Disable if error)</label><br>
            <label><input type="checkbox" name="use_kpm" value="true" checked> Enable KPM?</label><br>
            <label><input type="checkbox" name="get_manager" value="true" checked> Get latest KSU manager & SUS module?</label><br>
            <label><input type="checkbox" name="onlyAk3" value="true"> Upload only AK3 zip? (No boot, faster)</label><br>
        </div>

        <input type="text" id="token" placeholder="GitHub PAT (repo:write)" required><br>
        <button type="submit">Dispatch Workflow</button>
    </form>

    <script>
        const workflowSelect = document.getElementById('workflow');
        const testDiv = document.getElementById('testReleaseInputs');
        const buildDiv = document.getElementById('buildInputs');

        workflowSelect.addEventListener('change', () => {
            testDiv.style.display = 'none';
            buildDiv.style.display = 'none';
            if (workflowSelect.value === 'test_release.yml') {
                testDiv.style.display = 'block';
            } else if (workflowSelect.value.includes('build-kernel-')) {
                buildDiv.style.display = 'block';
            }
        });

        document.getElementById('dispatchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const inputs = Object.fromEntries(formData.entries());
            const workflowId = workflowSelect.value;

            const response = await fetch(`https://api.github.com/repos/OWNER/REPO/actions/workflows/${workflowId}/dispatches`, {
                method: 'POST',
                headers: { 'Authorization': `token ${inputs.token}`, 'Accept': 'application/vnd.github.v3+json' },
                body: JSON.stringify({ ref: 'main', inputs: { ...inputs, token: undefined } }) // Exclude token
            });

            if (response.ok) alert('Dispatched!');
            else alert('Error: ' + await response.text());
        });
    </script>
</body>
</html>
